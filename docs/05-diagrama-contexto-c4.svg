<text x='790' y='290' text-anchor='middle' font-size='22' font-weight='700' fill='#fff'>SkyCampus App</text>
<text x='790' y='318' text-anchor='middle' font-size='13' fill='#c7d2fe'>[Sistema de software]</text>
<text x='790' y='342' text-anchor='middle' font-size='12' fill='#c7d2fe'>Reparto de documentos con drones</text>
