<rect x='50' y='560' width='890' height='28' rx='6' fill='#f1f5f9' stroke='#cbd5e1'/>
<text x='62' y='579' font-size='12.5' fill='#334155'>Sin sistemas externos en el MVP: los drones se controlan localmente. Línea continua: datos hacia el sistema. Línea punteada: datos hacia el actor.</text>
