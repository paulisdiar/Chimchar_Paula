<text x='155' y='484' text-anchor='middle' font-size='16' font-weight='700' fill='#2e1065'>Admin</text>
<text x='155' y='506' text-anchor='middle' font-size='11.5' fill='#4c1d95'>[Persona] Configura destinos y flota</text>
<line x1='262' y1='478' x2='638' y2='478' stroke='#334155' stroke-width='1.6' marker-end='url(#a)'/>
