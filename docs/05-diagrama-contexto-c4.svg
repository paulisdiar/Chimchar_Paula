<text x='155' y='144' text-anchor='middle' font-size='16' font-weight='700' fill='#2e1065'>Solicitante</text>
<text x='155' y='166' text-anchor='middle' font-size='11.5' fill='#4c1d95'>[Persona] Persona que pide el reparto</text>
