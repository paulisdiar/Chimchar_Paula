<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='600' viewBox='0 0 1000 600' font-family='Segoe UI, Arial, sans-serif'>
<defs><marker id='a' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#334155'/></marker></defs>
<rect width='1000' height='600' fill='#ffffff'/>
<text x='30' y='36' font-size='20' font-weight='700' fill='#0f172a'>SkyCampus MVP - Diagrama de contexto (C4 nivel 1)</text>
<text x='30' y='58' font-size='13' fill='#475569'>Sistema como caja negra: actores y datos que fluyen en cada dirección</text>
