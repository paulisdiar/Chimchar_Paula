<text x='155' y='314' text-anchor='middle' font-size='16' font-weight='700' fill='#2e1065'>Operador de drones</text>
<text x='155' y='336' text-anchor='middle' font-size='11.5' fill='#4c1d95'>[Persona] Asigna y confirma entregas</text>
